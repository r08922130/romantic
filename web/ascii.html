<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工程師的浪漫</title>
<!--
  工程師的浪漫 - the web version of the terminal ASCII animation (main.py).
  GENERATED by tools/build_ascii_html.py from tools/ascii_web_template.html:
  the real Python engine plays every scene (once without cats, once for every
  choice of cats) and records the frames into ascii/<scene>.js; this page
  plays them back, the chosen cats on top of the background.
-->
<style>
  :root { --bg: #0c0c0c; --bar: #161616; --fg: #cccccc; --on: #ffd75f; --btn: #2a2a2a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 5px 10px;
    background: var(--bar); font-size: 14px; user-select: none; }
  .bar + .bar { border-top: 1px solid #222; }
  .bar button, .bar a { background: transparent; color: var(--fg); border: 0; border-radius: 5px;
    padding: 4px 9px; font: inherit; cursor: pointer; text-decoration: none; }
  .bar button:hover, .bar a:hover { background: var(--btn); color: #fff; }
  .bar button.on { color: var(--on); background: var(--btn); }
  .sep { width: 1px; height: 18px; background: #333; margin: 0 6px; }
  .cat { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 5px; cursor: pointer; }
  .cat:hover { background: var(--btn); }
  .cat input { accent-color: #d75f87; margin: 0; }
  .cat small { color: #777; }
  #note { color: #d75f87; font-size: 13px; }
  #seek { flex: 1; min-width: 120px; accent-color: #d75f87; }
  #clock { font-variant-numeric: tabular-nums; min-width: 84px; text-align: right; }
  #stage { flex: 1; position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #888; font-size: 15px; pointer-events: none; text-align: center; padding: 0 20px; }
  #hint { display: none; position: absolute; left: 0; right: 0; bottom: 14px; text-align: center;
    color: #666; font-size: 13px; pointer-events: none; }
</style>
</head>
<body>
<div class="bar">
  <a href="index.html" title="回首頁">←</a>
  <span id="scenes"></span>
  <span class="sep"></span>
  <button id="pause">暫停</button><button id="replay">重播</button><button id="surprise">驚喜 ♥</button>
  <input id="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="時間">
  <span id="clock"></span>
</div>
<div class="bar">
  <span>貓咪（最多 <span id="max"></span> 隻）</span>
  <span id="cats"></span>
  <span id="note"></span>
</div>
<div id="stage"><canvas id="cv"></canvas><div id="msg"></div><div id="hint">手機橫放看起來更大 ↻</div></div>
<script>const DATA = {"cols":120,"rows":34,"fps":15,"wide":"\u0001","clear":"\u0002","stage":78,"default":"christmas","maxCats":3,"cats":[{"name":"摸摸","skin":"tabby","on":true},{"name":"沐沐","skin":"patches","on":true},{"name":"逗逗","skin":"tuxedo","on":false},{"name":"妃妃","skin":"spots","on":false},{"name":"波波","skin":"ginger","on":false}],"scenes":[{"name":"christmas","label":"聖誕節","title":"Merry Christmas","seconds":110.0,"surprise":69.0},{"name":"osaka","label":"大阪城","title":"Osaka Castle under the cherry blossoms","seconds":100.0,"surprise":59.0},{"name":"tokyo","label":"東京晴空塔","title":"Tokyo Skytree at night","seconds":100.0,"surprise":59.0},{"name":"busan","label":"韓國釜山","title":"Busan: Gwangalli beach and Gwangan Bridge","seconds":100.0,"surprise":59.0},{"name":"pohang","label":"韓國浦項","title":"Pohang: Homigot sunrise and Guryongpo's camellias","seconds":100.0,"surprise":59.0},{"name":"seoul","label":"韓國首爾","title":"Seoul: N Seoul Tower and the Han River","seconds":100.0,"surprise":59.0},{"name":"taipei101","label":"台北 101 跨年煙火","title":"Taipei 101: New Year's Eve countdown and fireworks","seconds":100.0,"surprise":49.0}]};</script>
<script>
"use strict";
const COLS = DATA.cols, ROWS = DATA.rows, FPS = DATA.fps, WIDE = DATA.wide, CLEAR = DATA.clear, N = COLS * ROWS;
const BG = "#0c0c0c";
const ASPECT = 2.1;                     // a terminal cell is about twice as tall as wide

// the 256 terminal colours (0-15: Windows Terminal "Campbell", then the xterm cube and greys)
const PALETTE = ["#0c0c0c", "#c50f1f", "#13a10e", "#c19c00", "#0037da", "#881798", "#3a96dd", "#cccccc",
  "#767676", "#e74856", "#16c60c", "#f9f1a5", "#3b78ff", "#b4009e", "#61d6d6", "#f2f2f2"];
const LEVELS = [0, 95, 135, 175, 215, 255];
const hex = (v) => v.toString(16).padStart(2, "0");
for (let i = 16; i < 232; i++) {
  const k = i - 16;
  PALETTE.push("#" + hex(LEVELS[Math.floor(k / 36)]) + hex(LEVELS[Math.floor(k / 6) % 6]) + hex(LEVELS[k % 6]));
}
for (let i = 0; i < 24; i++) PALETTE.push("#" + hex(8 + 10 * i).repeat(3));

const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const $ = (id) => document.getElementById(id);

// a layer: the screen built up frame by frame from the recorded changes
class Layer {
  constructor(frames, blank) { this.frames = frames; this.blank = blank; this.reset(); }
  reset() { this.ch = new Array(N).fill(this.blank); this.st = new Int32Array(N); this.frame = -1; }
  goTo(f) {
    if (f < this.frame) this.reset();
    while (this.frame < f) {
      const d = this.frames[++this.frame];
      for (let k = 0; k < d.length; k += 3) {
        const start = d[k], chars = Array.from(d[k + 1]), sts = d[k + 2];
        for (let i = 0; i < chars.length; i++) { this.ch[start + i] = chars[i]; this.st[start + i] = sts[i]; }
      }
    }
  }
}

const loaded = {};                       // scene name -> {styles, bg, overlays} from ascii/<name>.js
const unpacked = {};                     // "scene|choice" -> frames
const P = { vc: COLS, c0: 0, scene: null, data: null, bg: null, ov: null, time: 0, paused: false,
  busy: false, cats: DATA.cats.map((c, i) => (c.on ? i : -1)).filter((i) => i >= 0).slice(0, DATA.maxCats),
  cw: 8, chh: 16, x0: 0, y0: 0, font: 14, W: 0, H: 0 };

// ---------------- loading ----------------
let waiting = null;
window.ASCII_SCENE = (data) => { loaded[data.name] = data; if (waiting) waiting(); };
function loadScene(name) {
  if (loaded[name]) return Promise.resolve();
  return new Promise((resolve, reject) => {
    waiting = resolve;
    const s = document.createElement("script");
    s.src = "ascii/" + name + ".js";
    s.onerror = () => reject(new Error("找不到 ascii/" + name + ".js"));
    document.head.appendChild(s);
  });
}
async function unpack(b64) {
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
  return JSON.parse(await new Response(stream).text());
}
async function frames(name, key, b64) {
  const id = name + "|" + key;
  if (!unpacked[id]) unpacked[id] = await unpack(b64);
  return unpacked[id];
}
const choiceKey = () => P.cats.slice().sort((a, b) => a - b).join(",");

async function choose(name) {
  const meta = DATA.scenes.find((s) => s.name === name) || DATA.scenes[0];
  P.scene = meta;
  for (const b of document.querySelectorAll("#scenes button")) b.classList.toggle("on", b.dataset.name === meta.name);
  $("seek").max = meta.seconds;
  try { history.replaceState(null, "", "#" + meta.name); } catch (e) { /* some browsers on file:// */ }
  if (typeof DecompressionStream === "undefined") {
    $("msg").textContent = "這個瀏覽器太舊了，請用新版的 Chrome、Edge、Safari 或 Firefox 打開。";
    return;
  }
  P.busy = true;
  $("msg").textContent = "載入中…";
  try {
    await loadScene(meta.name);
    if (P.scene !== meta) return;
    P.data = loaded[meta.name];
    P.bg = new Layer(await frames(meta.name, "bg", P.data.bg), " ");
    await setCats(0);
    $("msg").textContent = "";
  } catch (e) {
    $("msg").textContent = e.message + "（ascii.html 要和 ascii 資料夾放在一起）";
  } finally {
    P.busy = false;
  }
}
async function setCats(t) {              // the overlay of the chosen cats, at time t
  const key = choiceKey();
  P.ov = key ? new Layer(await frames(P.scene.name, key, P.data.overlays[key]), CLEAR) : null;
  seek(t);
}

// ---------------- playing ----------------
const frameAt = (t) => Math.min(P.bg.frames.length - 1, Math.floor(t * FPS));
function show(f) { P.bg.goTo(f); if (P.ov) P.ov.goTo(f); draw(); }
function seek(t) {
  if (!P.bg) return;
  P.time = Math.max(0, Math.min(t, P.scene.seconds));
  show(frameAt(P.time));
}

// ---------------- drawing ----------------
function layout() {
  const r = cv.parentElement.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // an upright phone shows only the stage in the middle (the scenery beside it is cut off)
  const portrait = r.width < r.height;
  P.vc = portrait ? DATA.stage : COLS;
  P.c0 = (COLS - P.vc) >> 1;
  $("hint").style.display = portrait ? "block" : "none";
  P.cw = Math.min(r.width / P.vc, r.height / (ROWS * ASPECT));
  P.chh = P.cw * ASPECT;
  P.x0 = (r.width - P.cw * P.vc) / 2 - P.c0 * P.cw;
  P.y0 = (r.height - P.chh * ROWS) / 2;
  P.font = Math.min(P.cw / 0.6, P.chh * 0.92);
  P.W = r.width; P.H = r.height;
  draw();
}

function draw() {
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, P.W, P.H);
  if (!P.bg) return;
  ctx.textBaseline = "middle";
  ctx.textAlign = "center";
  const fonts = [`${P.font}px Consolas, "Cascadia Mono", Menlo, "DejaVu Sans Mono", monospace`,
    `bold ${P.font}px Consolas, "Cascadia Mono", Menlo, "DejaVu Sans Mono", monospace`];
  const styles = P.data.styles, bg = P.bg, ov = P.ov;
  const chAt = (i) => (ov && ov.ch[i] !== CLEAR ? ov.ch[i] : bg.ch[i]);
  const stAt = (i) => (ov && ov.ch[i] !== CLEAR ? ov.st[i] : bg.st[i]);
  let curFont = -1, curFill = -1;
  for (let y = 0; y < ROWS; y++) {
    const cy = P.y0 + (y + 0.5) * P.chh;
    for (let x = P.c0; x < P.c0 + P.vc; x++) {
      const i = y * COLS + x, c = chAt(i);
      if (c === " " || c === WIDE) continue;
      const s = styles[stAt(i)];
      if (s < 0) continue;
      const bold = s & 256 ? 1 : 0, col = s & 255;
      if (bold !== curFont) { ctx.font = fonts[bold]; curFont = bold; }
      if (col !== curFill) { ctx.fillStyle = PALETTE[col]; curFill = col; }
      const wide = x + 1 < COLS && chAt(i + 1) === WIDE ? 2 : 1;
      ctx.fillText(c, P.x0 + (x + wide / 2) * P.cw, cy, P.cw * wide * 1.02);
    }
  }
}

let last = performance.now();
function tick(now) {
  const dt = Math.min(0.5, (now - last) / 1000);      // also keeps time in throttled tabs
  last = now;
  if (P.bg && !P.paused && !P.busy) {
    P.time += dt;
    if (P.time >= P.scene.seconds) P.time = 0;          // play it again
    const f = frameAt(P.time);
    if (f !== P.bg.frame) show(f);
    $("seek").value = P.time.toFixed(1);
  }
  const mmss = (s) => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
  if (P.scene) $("clock").textContent = mmss(P.time) + " / " + mmss(P.scene.seconds);
  requestAnimationFrame(tick);
}

// ---------------- controls ----------------
for (const s of DATA.scenes) {
  const b = document.createElement("button");
  b.textContent = s.label;
  b.title = s.title;
  b.dataset.name = s.name;
  b.onclick = () => choose(s.name);
  $("scenes").appendChild(b);
}
$("max").textContent = DATA.maxCats;
DATA.cats.forEach((c, i) => {
  const l = document.createElement("label");
  l.className = "cat";
  l.innerHTML = `<input type="checkbox"> <span></span> <small></small>`;
  l.querySelector("span").textContent = c.name;
  l.querySelector("small").textContent = c.skin;
  const box = l.querySelector("input");
  box.checked = P.cats.includes(i);
  box.onchange = async () => {
    $("note").textContent = "";
    if (box.checked && P.cats.length >= DATA.maxCats) {
      box.checked = false;
      $("note").textContent = "最多只能選 " + DATA.maxCats + " 隻貓咪";
      return;
    }
    P.cats = box.checked ? P.cats.concat([i]) : P.cats.filter((j) => j !== i);
    if (P.data) { P.busy = true; await setCats(P.time); P.busy = false; }
  };
  $("cats").appendChild(l);
});
function togglePause() { P.paused = !P.paused; $("pause").textContent = P.paused ? "繼續" : "暫停"; }
$("pause").onclick = togglePause;
$("replay").onclick = () => seek(0);
$("surprise").onclick = () => P.scene && seek(P.scene.surprise);
$("seek").oninput = (e) => seek(parseFloat(e.target.value));
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" && e.target.type === "range") return;
  const k = e.key.toLowerCase();
  if (k === " ") { togglePause(); e.preventDefault(); }
  else if (k === "r") seek(0);
  else if (k === "s") $("surprise").onclick();
  else if (k === "n") {
    const i = DATA.scenes.indexOf(P.scene);
    choose(DATA.scenes[(i + 1) % DATA.scenes.length].name);
  }
});
new ResizeObserver(layout).observe($("stage"));

layout();
choose(decodeURIComponent(location.hash.slice(1)) || DATA.default);
requestAnimationFrame(tick);
</script>
</body>
</html>
