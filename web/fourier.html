const APPEAR = 1.2, HOLD = 1.0, FADE = 1.5, FILL = 2.0, GREETING = 4.0;
const STRETCH = 4.5;            // one stroke takes this many times the "tree seconds"
const POOL = 600;               // most circles drawn per frame
const FILL_ORDER = ["trunk", "tree", "star", "garland", "orn", "box", "bow"];
const isGift = (label) => /^(box|ribbon|bow|ground)/.test(label);   // in front of the tree
// the pictures: the tree (2048 samples) and the cats (4096: the faces need finer detail)
const PICTURES = [Object.assign({ name: "tree", title: "聖誕樹", choices: [200, 500, 1000, 1500, 2048], terms: 1000 }, DATA.one)]
  .concat(DATA.cats.map((c) => Object.assign({ cat: true, choices: [200, 500, 1000, 2000, 4096], terms: 2000 }, c)));
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));

// ------------------------------------------------------------------
//  The maths (the same as fourier.py)
// ------------------------------------------------------------------
// radix-2 FFT in place: X_n = sum_k z_k exp(-i 2 pi n k / N)
function fft(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j |= bit;
    if (i < j) {
      let t = re[i]; re[i] = re[j]; re[j] = t;
      t = im[i]; im[i] = im[j]; im[j] = t;
    }
  }
  for (let size = 2; size <= n; size *= 2) {
    const half = size / 2, step = -TAU / size;
    for (let k = 0; k < half; k++) {
      const wr = Math.cos(step * k), wi = Math.sin(step * k);
      for (let s = 0; s < n; s += size) {
        const a = s + k, b = a + half;
        const vr = re[b] * wr - im[b] * wi, vi = re[b] * wi + im[b] * wr;
        re[b] = re[a] - vr; im[b] = im[a] - vi;
        re[a] += vr; im[a] += vi;
      }
    }
  }
}
const freqOf = (k, n) => (k < Math.floor((n + 1) / 2) ? k : k - n);

// c_n = 1/N sum_k z_k exp(-i 2 pi n k / N)
function dft(xs, ys) {
  const N = xs.length, re = Float64Array.from(xs), im = Float64Array.from(ys);
  fft(re, im);
  const out = [];
  for (let k = 0; k < N; k++) {
    out.push({ n: freqOf(k, N), re: re[k] / N, im: im[k] / N, r: Math.hypot(re[k], im[k]) / N });
  }
  return out;
}
const lowFirst = (a, b) => (Math.abs(a.n) - Math.abs(b.n)) || (b.n - a.n);    // 0, 1, -1, 2, -2 ...
const truncate = (c, terms) => c.slice().sort(lowFirst).slice(0, clamp(terms, 1, c.length));
const bySize = (c) => c.slice().sort((a, b) => ((a.n !== 0) - (b.n !== 0)) || (b.r - a.r));
const byFrequency = (c) => c.slice().sort(lowFirst);

// z(k/m) for k = 0..m-1 (m a power of two): one inverse FFT; one more point closes it
function reconstruct(c, m, close) {
  const re = new Float64Array(m), im = new Float64Array(m);
  for (const q of c) { const i = ((q.n % m) + m) % m; re[i] += q.re; im[i] -= q.im; }
  fft(re, im);
  const len = close ? m + 1 : m, xs = new Float64Array(len), ys = new Float64Array(len);
  for (let k = 0; k < m; k++) { xs[k] = re[k]; ys[k] = -im[k]; }
  if (close) { xs[m] = xs[0]; ys[m] = ys[0]; }
  return { xs, ys, n: len };
}
function maxError(c, xs, ys) {
  const r = reconstruct(c, xs.length, false);
  let e = 0;
  for (let k = 0; k < xs.length; k++) e = Math.max(e, Math.hypot(r.xs[k] - xs[k], r.ys[k] - ys[k]));
  return e;
}
// heads of the rotating vectors, head to tail; the last one is the pen
function chain(c, t) {
  const hx = new Float64Array(c.length), hy = new Float64Array(c.length);
  let x = 0, y = 0;
  for (let i = 0; i < c.length; i++) {
    const q = c[i], a = TAU * q.n * t, cs = Math.cos(a), sn = Math.sin(a);
    x += q.re * cs - q.im * sn; y += q.re * sn + q.im * cs;
    hx[i] = x; hy[i] = y;
  }
  return { hx, hy };
}
function unpack(flat) {
  const n = flat.length / 2, xs = new Float64Array(n), ys = new Float64Array(n);
  for (let i = 0; i < n; i++) { xs[i] = flat[2 * i]; ys[i] = flat[2 * i + 1]; }
  return { xs, ys };
}

// ------------------------------------------------------------------
//  一筆畫: the whole picture as ONE closed curve, ONE series
// ------------------------------------------------------------------
class OneModel {
  constructor(o) {
    const { xs, ys } = unpack(o.pts);
    this.pic = o; this.cat = !!o.cat;
    this.xs = xs; this.ys = ys;
    this.labels = o.lab.map((i) => o.names[i]);
    this.parts = o.parts;
    this.coeffs = dft(xs, ys);
    this.order = "size";
    this.bounds = boundsOf(xs, ys);
  }
  setTerms(terms) {
    this.terms = clamp(terms, 1, this.coeffs.length);
    const kept = truncate(this.coeffs, this.terms), S = this.xs.length, m = 4 * S;
    this.chain = this.order === "size" ? bySize(kept) : byFrequency(kept);
    this.error = maxError(kept, this.xs, this.ys);
    this.curve = reconstruct(kept, m, true);
    this.curveLabels = [];
    for (let k = 0; k <= m; k++) this.curveLabels.push(this.labels[Math.min(S - 1, Math.floor(k * S / m))]);
    this.runs = [];                          // stretches of one part: [label, first, last]
    let start = 0;
    for (let k = 1; k <= m + 1; k++) {
      if (k === m + 1 || this.curveLabels[k] !== this.curveLabels[start]) {
        this.runs.push([this.curveLabels[start], start, Math.min(k, m)]);
        start = k;
      }
    }
    this.fills = [];                         // each part filled from its own stretch
    const rank = (l) => FILL_ORDER.findIndex((p) => l.startsWith(p));
    const labels = Object.keys(this.parts).filter((l) => this.parts[l].fill);
    if (!this.cat) labels.sort((a, b) => rank(a) - rank(b));      // a cat's parts are in painting order
    for (const l of labels) {
      const idx = [];
      for (let k = 0; k <= m; k++) if (this.curveLabels[k] === l) idx.push(k);
      if (idx.length >= 3) this.fills.push([l, idx]);
    }
  }
  setSeconds(seconds) {
    this.drawSecs = seconds * STRETCH;
    this.drawEnd = APPEAR + this.drawSecs;
    this.done = this.drawEnd + HOLD + FADE;
  }
}

function boundsOf(xs, ys) {
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (let i = 0; i < xs.length; i++) {
    x0 = Math.min(x0, xs[i]); x1 = Math.max(x1, xs[i]);
    y0 = Math.min(y0, ys[i]); y1 = Math.max(y1, ys[i]);
  }
  return { x0, x1, y0, y1 };
}

// ------------------------------------------------------------------
//  The page
// ------------------------------------------------------------------
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const params = new URLSearchParams(location.search);
const S = {
  seconds: clamp(parseFloat(params.get("seconds")) || 10, 4, 30),
  show: true, paused: false, time: parseFloat(params.get("at")) || 0,
  order: "size", W: 0, H: 0, scale: 1, ox: 0, oy: 0, groundY: 0,
  stars: [], snow: [],
};
const models = {};                       // made when a picture is first chosen
let model = null;
function useModel(name) {
  const pic = PICTURES.find((p) => p.name === name) || PICTURES[0];
  if (!models[pic.name]) models[pic.name] = new OneModel(pic);
  model = models[pic.name];
  model.order = S.order;
  model.setTerms(model.terms || pic.terms);
  model.setSeconds(S.seconds);
}

function rgb(h) { return [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)); }
function mix(c1, c2, a) {
  a = clamp(a);
  const p = rgb(c1), q = rgb(c2);
  return "rgb(" + p.map((v, i) => Math.round(v + (q[i] - v) * a)).join(",") + ")";
}
const X = (x) => S.ox + x * S.scale, Y = (y) => S.oy + y * S.scale;

function choosePicture(name) {
  useModel(name);
  try { history.replaceState(null, "", "#" + model.pic.name); }
  catch (e) { /* an embedded preview (about:srcdoc) has no address to change */ }
  buildTermButtons();
  replay();
}
function chooseTerms(n) { model.setTerms(n); refreshUI(); replay(); }
function replay() { S.time = 0; layout(); }

function layout() {
  const r = cv.parentElement.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  S.W = Math.max(200, r.width); S.H = Math.max(200, r.height);
  cv.width = Math.round(S.W * dpr); cv.height = Math.round(S.H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const b = model.bounds;
  S.scale = Math.min(S.H * 0.80 / (b.y1 - b.y0), S.W * 0.90 / (b.x1 - b.x0));
  S.ox = S.W / 2;
  S.oy = S.H * 0.52 - (b.y1 + b.y0) / 2 * S.scale;
  S.groundY = Y(DATA.groundY);
  S.stars = Array.from({ length: 110 }, () => ({
    x: Math.random() * S.W, y: Math.random() * Math.max(10, model.cat ? S.H : S.groundY - 60),
    r: [0.8, 1.0, 1.4][Math.floor(Math.random() * 3)], ph: Math.random() * 6.28 }));
  S.snow = Array.from({ length: 140 }, () => ({
    x: Math.random() * S.W, y: (Math.random() * 2 - 1) * S.H,
    r: [1.2, 1.8, 2.4][Math.floor(Math.random() * 3)], v: 25 + Math.random() * 35, ph: Math.random() * 6.28 }));
  refreshUI();
}

function path(c, i0, i1) {               // points i0 .. i1-1 of a curve
  ctx.beginPath();
  ctx.moveTo(X(c.xs[i0]), Y(c.ys[i0]));
  for (let k = i0 + 1; k < i1; k++) ctx.lineTo(X(c.xs[k]), Y(c.ys[k]));
}
function stroke(colour, width) {
  ctx.strokeStyle = colour; ctx.lineWidth = width; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.stroke();
}

// the rotating circles, the arms and the pen of one chain
function drawChain(c, t, alpha, budget, armAlpha, tipR) {
  const { hx, hy } = chain(c, t);
  let used = 0;
  ctx.lineWidth = 1;
  ctx.strokeStyle = "#5f7bd6";
  let px = hx[0], py = hy[0];
  for (let j = 1; j < c.length; j++) {
    const r = c[j].r * S.scale;
    if (r >= 1.5 && used < budget) {
      const faint = Math.min(1, 0.35 + 6 / (r + 6));
      ctx.globalAlpha = alpha * (1 - faint * 0.6);
      ctx.beginPath(); ctx.arc(X(px), Y(py), r, 0, TAU); ctx.stroke();
      used++;
    }
    px = hx[j]; py = hy[j];
  }
  ctx.globalAlpha = alpha * armAlpha;
  ctx.beginPath(); ctx.moveTo(X(hx[0]), Y(hy[0]));
  for (let j = 1; j < c.length; j++) ctx.lineTo(X(hx[j]), Y(hy[j]));
  stroke("#c9d4ee", 1.1);
  ctx.globalAlpha = Math.min(1, alpha * 1.5);
  ctx.fillStyle = "#ffd54a";
  ctx.beginPath(); ctx.arc(X(px), Y(py), tipR, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
  return used;
}

function fillColour(name, colour, pulse) {
  if (name === "tree") return "#145c32";
  if (name === "star") return mix("#ffd54a", "#fff3b0", pulse);
  return colour;
}

// a cat: every part is filled and outlined in painting order, so the parts in
// front cover the ones behind; the links between the parts fade away
function renderParts(m, a, n) {
  const fills = new Map(m.fills), runs = new Map();
  for (const run of m.runs) {
    if (!runs.has(run[0])) runs.set(run[0], []);
    runs.get(run[0]).push(run);
  }
  for (const label of Object.keys(m.parts)) {
    const part = m.parts[label], idx = fills.get(label);
    if (a > 0 && idx) {
      ctx.globalAlpha = clamp(a);
      ctx.beginPath();
      ctx.moveTo(X(m.curve.xs[idx[0]]), Y(m.curve.ys[idx[0]]));
      for (let k = 1; k < idx.length; k++) ctx.lineTo(X(m.curve.xs[idx[k]]), Y(m.curve.ys[idx[k]]));
      ctx.fillStyle = part.colour;
      ctx.fill();
    }
    ctx.globalAlpha = label === "link" ? 1 - clamp(a) : 1;
    for (const [, i0, i1] of runs.get(label) || []) {
      const end = Math.min(i1, n);
      if (end - i0 < 1) continue;
      path(m.curve, i0, Math.min(end + 1, m.curve.n));
      stroke(part.line, part.width);
    }
    ctx.globalAlpha = 1;
  }
}

function renderOne() {
  const m = model, t = S.time, after = t - m.done, a = after / FILL;
  const pulse = 0.5 + 0.5 * Math.sin(t * 3);
  if (!m.cat) ground(a * 0.85);
  const p = (t - APPEAR) / m.drawSecs, n = Math.floor((m.curve.n - 1) * clamp(p));
  // the tree first, then the presents in front of it: once filled, they
  // cover the tree's lines (its hem, the strings)
  if (m.cat) renderParts(m, a, n);
  else for (const front of [false, true]) {
    if (a > 0) {
      ctx.globalAlpha = clamp(a);
      for (const [label, idx] of m.fills) {
        if (isGift(label) !== front) continue;
        ctx.beginPath();
        ctx.moveTo(X(m.curve.xs[idx[0]]), Y(m.curve.ys[idx[0]]));
        for (let k = 1; k < idx.length; k++) ctx.lineTo(X(m.curve.xs[idx[k]]), Y(m.curve.ys[idx[k]]));
        ctx.fillStyle = fillColour(label, m.parts[label].colour, pulse);
        ctx.fill("evenodd");
      }
      ctx.globalAlpha = 1;
    }
    for (const [label, i0, i1] of m.runs) {     // the trace, coloured part by part
      const end = Math.min(i1, n);
      if (end - i0 < 1 || isGift(label) !== front) continue;
      path(m.curve, i0, end + 1);
      stroke(m.parts[label].colour, m.parts[label].width);
    }
  }
  if (!m.cat) rays(after, pulse);
  let alpha = Math.min(1, t / APPEAR, 1 - (t - m.drawEnd - HOLD) / FADE);
  alpha = S.show ? clamp(alpha) : 0;
  let used = 0;
  if (alpha > 0.02) used = drawChain(m.chain, p, alpha, POOL, 0.7, 4);
  christmas(after);
  const now = p >= 0 && p <= 1 ? m.curveLabels[n] : "-";
  caption(alpha > 0.02 ? `one stroke: ${m.terms} terms, ${used} circles shown   now drawing: ${now}   ${Math.floor(100 * clamp(p))}%` : "");
}

function ground(alpha) {
  if (alpha <= 0) return;
  ctx.globalAlpha = clamp(alpha);
  ctx.fillStyle = GROUND;
  ctx.beginPath();
  ctx.rect(-10, S.groundY, S.W + 20, S.H);
  ctx.fill();
  ctx.globalAlpha = 1;
}

function rays(after, pulse) {
  const on = clamp(after / FILL - 0.5);
  if (on <= 0) return;
  const t = S.time, sx = X(0), sy = Y(DATA.starCY);
  ctx.globalAlpha = on * (0.6 + 0.4 * pulse);
  for (let i = 0; i < 8; i++) {
    const ang = i * Math.PI / 4 + Math.PI / 8 + t * 0.3, r0 = S.scale * 0.2;
    const r1 = r0 + S.scale * (0.07 + 0.05 * (0.5 + 0.5 * Math.sin(t * 3 + i * 1.7))) * on;
    ctx.beginPath();
    ctx.moveTo(sx + r0 * Math.cos(ang), sy + r0 * Math.sin(ang));
    ctx.lineTo(sx + r1 * Math.cos(ang), sy + r1 * Math.sin(ang));
    stroke("#ffe680", 2);
  }
  ctx.globalAlpha = 1;
}

let lastDt = 0.016;
function christmas(after) {
  if (after > FILL) {                                   // snow
    ctx.fillStyle = "#ffffff";
    for (const f of S.snow) {
      if (!S.paused) {
        f.y += f.v * lastDt;
        f.x += Math.sin(S.time * 0.8 + f.ph) * 0.4;
        if (f.y > S.H) f.y = -5;
      }
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, TAU); ctx.fill();
    }
  }
  const greeting = DATA.greeting, wish = DATA.wish;
  const g = Math.max(0, Math.floor((after - GREETING) * 14));
  const w = Math.max(0, Math.floor((after - GREETING - greeting.length / 14 - 0.6) * 18));
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const big = Math.min(26, S.W / 18), small = Math.min(15, S.W / 28);
  if (g > 0) {
    ctx.font = `italic bold ${big}px Georgia, serif`;
    ctx.fillStyle = "#ffb3c7";
    ctx.fillText(greeting.slice(0, g) + (g > greeting.length ? " ♥" : ""), S.W / 2, 34);
  }
  if (w > 0) {
    ctx.font = `italic ${small}px Georgia, serif`;
    ctx.fillStyle = "#ffd9e3";
    ctx.fillText(wish.slice(0, w), S.W / 2, 34 + big * 1.45);
  }
}

function caption(text) {
  if (!text) return;
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.font = "11px Consolas, Menlo, monospace";
  ctx.fillStyle = "#5c6a92";
  ctx.fillText(text, 12, S.H - 14);
}

function render() {
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, S.W, S.H);
  for (const s of S.stars) {                             // the twinkling sky
    ctx.fillStyle = mix("#2b3557", "#dfe7ff", 0.5 + 0.5 * Math.sin(S.time * 1.5 + s.ph));
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
  }
  renderOne();
}

let last = performance.now();
function tick(now) {
  lastDt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!S.paused) S.time += lastDt;
  render();
  requestAnimationFrame(tick);
}

// ------------------------------------------------------------------
//  Controls
// ------------------------------------------------------------------
const $ = (id) => document.getElementById(id);
function buildTermButtons() {
  const box = $("terms"), choices = model.pic.choices;
  box.textContent = "";
  for (const n of choices) {
    const b = document.createElement("button");
    b.textContent = n === choices[choices.length - 1] ? "全部" : String(n);
    b.dataset.n = n;
    b.onclick = () => chooseTerms(n);
    box.appendChild(b);
  }
}
function buildPictureButtons() {
  for (const p of PICTURES) {
    const b = document.createElement("button");
    b.textContent = p.title;
    b.dataset.pic = p.name;
    b.onclick = () => { b.blur(); choosePicture(p.name); };
    $("pics").appendChild(b);
  }
}
function refreshUI() {
  for (const b of document.querySelectorAll("#pics button")) b.classList.toggle("on", b.dataset.pic === model.pic.name);
  for (const b of document.querySelectorAll("#terms button")) b.classList.toggle("on", +b.dataset.n === model.terms);
  for (const b of document.querySelectorAll("#orders button")) b.classList.toggle("on", b.dataset.order === S.order);
  $("pause").textContent = S.paused ? "繼續" : "暫停";
  $("info").textContent = "誤差 " + (model.error * S.scale).toFixed(1) + " px";
}
for (const b of document.querySelectorAll("#orders button")) b.onclick = () => {
  S.order = b.dataset.order; model.order = S.order; model.setTerms(model.terms); replay();
};
const speed = $("speed");                // right = faster: the slider is 34 - seconds
speed.value = 34 - S.seconds;
speed.oninput = () => { S.seconds = 34 - parseFloat(speed.value); model.setSeconds(S.seconds); };
$("circ").onchange = (e) => { S.show = e.target.checked; };
$("pause").onclick = () => { S.paused = !S.paused; refreshUI(); };
$("replay").onclick = replay;
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" && e.target.type === "range") return;
  const k = e.key.toLowerCase();
  if (k === " ") { S.paused = !S.paused; refreshUI(); e.preventDefault(); }
  else if (k === "r") replay();
  else if (k === "c") { S.show = !S.show; $("circ").checked = S.show; }
  else if (k >= "1" && k <= "5") chooseTerms(model.pic.choices[+k - 1]);
});
useModel(location.hash.slice(1));
new ResizeObserver(() => { const t = S.time; layout(); S.time = t; }).observe($("stage"));

const at = S.time;
if (parseInt(params.get("terms"))) model.setTerms(parseInt(params.get("terms")));
buildPictureButtons();
buildTermButtons();
replay();
S.time = at;
requestAnimationFrame(tick);
</script>
</body>
</html>
